# =============================================================================
# soup.modal.yaml — Gemma Tounsi 1.0 (27B) Modal remote training configuration
# =============================================================================
#
# Generated from soup.yaml for Modal cloud execution.
# Paths are absolute container paths inside the Modal L40S container:
#   - Dataset:  /mnt/data/soup_trainval.jsonl  (Modal Volume: gemma-tounsi-data)
#   - Output:   /checkpoints/gemma-tounsi-1.0-27b  (Modal Volume: gemma-tounsi-checkpoints)
#   - HF cache: /hf-cache  (Modal Volume: gemma-tounsi-hf-cache)
#
# Do NOT edit this file directly. Regenerate from soup.yaml if hyperparameters
# change. Only the data.train path and output path differ from soup.yaml.
# =============================================================================

# --- Base model --------------------------------------------------------------
base: google/gemma-3-27b-it

# SoupConfig.task — supervised fine-tuning.
task: sft

# SoupConfig.backend — stock transformers path.
backend: transformers

# SoupConfig.modality — text SFT.
modality: text

# --- Data --------------------------------------------------------------------
# Combined train+validation file (90% train + 5% val, no shuffle).
# Lives on Modal Volume gemma-tounsi-data at /mnt/data/soup_trainval.jsonl.
# Test set (5%) is deliberately excluded.
data:
  train: /mnt/data/soup_trainval.jsonl
  format: chatml
  val_split: 0.05263068143061777
  max_length: 8192
  train_on_responses_only: true
  chat_template: gemma3

# --- Training ----------------------------------------------------------------
training:
  epochs: 2
  lr: 1.0e-5
  batch_size: 1
  gradient_accumulation_steps: 8

  # QLoRA = 4-bit quantized base + LoRA adapter.
  quantization: 4bit

  # LoRA adapter.
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

  # Gradient checkpointing for memory savings on long sequences (8192 tokens).
  gradient_checkpointing: true

  # Include EOS/EOT tokens in the SFT loss.
  train_on_eot: true

  seed: 42
  logging_steps: 10
  save_steps: 100

  # Layer streaming stays OFF.
  stream_layers: false

# --- Output ------------------------------------------------------------------
# All checkpoints, logs, and final adapter artifacts written to persistent
# Modal Volume gemma-tounsi-checkpoints at /checkpoints/gemma-tounsi-1.0-27b.
output: /checkpoints/gemma-tounsi-1.0-27b
