# =============================================================================
# configs/data/retention.yaml — retention slice specification
# =============================================================================
#
# PURPOSE
#   The retention slice exists to PRESERVE Gemma 3 27B's ORIGINAL general
#   capabilities after Tunisian adaptation. It is replay/rehearsal data.
#
#   It is *** NOT *** a Tunisian-language dataset.
#   It does *** NOT *** require Tunisian output.
#   It is NEVER confused with the msa_formal slice, whose purpose is
#   formal/register coverage of Arabic (see configs/data/mixture.yaml).
#
#   Retention is 0.20 of the training TOKENS and is primarily ENGLISH.
#   Production strategy: docs/data/retention_mohamed.md Section 3 and
#   docs/data/retention_haithem.md Section 2.
#   Token-aware selection/packing is pending implementation in the pipeline.
#   Legacy count fields below remain ONLY for existing synthetic smoke tests.
#
# DATASET-INDEPENDENT BY DESIGN
#   No external dataset is named here. Candidate pools are supplied at run time
#   as canonical JSONL (see docs/DATA_SCHEMA.md); the selector in
#   src/data/retention.py reads THIS file for its targets, never a dataset name.
#
# CONSUMED BY
#   src/data/retention.py  (selection + stratified sampling + holdout)
#   scripts/prepare_data.sh
# =============================================================================

spec_version: "1.2"
slice: retention

# --- Purpose (machine-readable, so tests can assert it) ----------------------
purpose: english_capability_preservation
is_tunisian_adaptation: false      # MUST stay false. Retention != adaptation.
requires_tunisian_output: false    # MUST stay false.

# --- Required schema ---------------------------------------------------------
# The canonical schema is the ONLY accepted input shape. Records that fail
# schema validation are REJECTED, never coerced or auto-fixed.
schema:
  file: configs/data/schema.yaml
  docs: docs/DATA_SCHEMA.md
  required_fields: [id, messages, category, source, language]
  messages:
    min_turns: 2
    roles: [system, user, assistant]
    last_role: assistant
    non_empty_content: true

# --- Production token budgets ------------------------------------------------
# Reserve holdout first, then select coding and MEASURE its formatted Gemma
# tokens. Other category budgets use this anchor, never estimated token totals.
token_budget:
  unit: tokens
  metric: assistant_tokens
  fallback_metric: total_tokens  # only when assistant counting is impractical
  require_same_metric_for_all_categories: true
  tokenizer: gemma
  include_chat_template: true
  count: [total_tokens, assistant_tokens]
  anchor:
    category: coding
    target_examples: 5000
  category_multipliers:
    coding: 1.0
    mathematics: 1.0
    reasoning: 0.8
    general_instruction: 0.6
    knowledge_qa: 0.6
  tolerance: 0.02
  context_window_tokens: 16384
  max_formatted_tokens_per_example: 15500
  whole_examples_only: true
  on_overlength: drop
  holdout:
    reserve_first: true
    unit: tokens
    target_tokens: null  # set absolute size before production; not fixed in reports
    category_shares:
      coding: 0.25
      mathematics: 0.25
      reasoning: 0.20
      general_instruction: 0.15
      knowledge_qa: 0.15
    pack_with_training: false
  packing:
    strategy: first_fit_decreasing
    sequence_length_tokens: 16384
    attention_mask: block_diagonal
    reset_position_ids_per_example: true
    verify_gemma3_hybrid_attention: true
    pad_only_final_partial_sequence: true

# --- Legacy counts: synthetic compatibility ONLY, NOT production targets ------
# src/data/retention.py still reads these. Production counts must emerge from
# token_budget; 20k is neither a production target nor a ceiling.
target_examples: 20000

categories:
  mathematics: 5000
  coding: 5000
  reasoning: 4000
  instruction_following: 3000
  knowledge_qa: 3000

# Maps the target keys above onto the canonical `category` enum in
# configs/data/schema.yaml. Only `instruction_following` needs a mapping:
# the canonical category name is `general_instruction`.
category_aliases:
  instruction_following: general_instruction

# --- Language ----------------------------------------------------------------
language:
  primary: english
  # Canonical `language` values accepted inside this slice.
  allowed: [en]
  # Canonical records remain English. Keep Latin-script translation exercises
  # with English instructions; record that exception in the selection manifest.
  allow_other_languages: false
  keep_english_instruction_latin_translation_tasks: true

# --- Quality gate ------------------------------------------------------------
# Machine-readable quality rules asserted by tests. The selector enforces these
# on every candidate BEFORE selection; nothing is auto-fixed or downgraded.
quality:
  required_schema_valid: true   # hard reject any schema-invalid record
  exclude_flagged: true         # quality.flagged == true is never selected
  language_allowed: [en]        # mirrors `language.allowed`
  script_allowed: [latin]       # English retention is Latin-script
  require_unique_ids: true      # dedupe by id before selection (first wins)
  dedupe_before_selection: true
  min_messages_turns: 2
  end_with_assistant: true

# --- Legacy holdout: synthetic compatibility ONLY -----------------------------
# Production uses token_budget.holdout, not a fixed 2,500-example holdout.
# Reserved BEFORE training selection and never included in training.
holdout:
  target_examples: 2500
  # Holdout is carved out per category in the same proportions as `categories`,
  # so the holdout is representative rather than skewed to one capability.
  stratified: true
  # Emitted to data/processed/retention/holdout.jsonl
  output: data/processed/retention/holdout.jsonl

# --- Output ------------------------------------------------------------------
output:
  train: data/processed/retention/train.jsonl
  holdout: data/processed/retention/holdout.jsonl
  manifest: data/manifests/retention/selection.json

# --- Selection behaviour -----------------------------------------------------
selection:
  # Deterministic: same candidates + same seed => byte-identical output.
  seed: 42
  # Legacy selector uses counts; production stratifies inside token budgets.
  stratify_by: category
  stable_sort_by: id
  # Source diversity: no single `source` may exceed this share of a category.
  # 1.0 disables the source cap; production diversity rules are below.
  max_share_per_source: 1.0
  # Records flagged by quality.flagged are never selected.
  exclude_flagged: true
  # Deduplicate by id before selecting (see src/data/dedupe.py).
  require_unique_ids: true
  # If a category cannot be filled, FAIL LOUDLY rather than under-filling or
  # borrowing from another category.
  on_insufficient_candidates: error

# --- Production diversity/hygiene (before budget filling) ---------------------
diversity:
  coding:
    language_shares:
      python: 0.50
      javascript_typescript: 0.15
      java_c_cpp: 0.15
      go_rust: 0.05
      other: 0.15
    task_shares:
      generation: 0.50
      debugging_fixing: 0.30
      refactor_optimize_explain: 0.20
    length_band_edges_tokens: [1000, 3000, 6000, 10000]
    preserve_multi_turn: true
  mathematics:
    source_family_token_shares: {gsm8k: 0.60, math: 0.40}
    stratify_by_type: true
    max_sv_fobar_combined_share: 0.30
    max_variants_per_seed_problem: 2
  instruction_pool:
    tagging_priority: [reasoning, knowledge_qa, general_instruction]
    deterministic_tagging: true
    audit_examples_per_category: 200
    template_key: original_system_prompt_hash
    max_examples_per_template: 200
    standardize_system_prompts_before_tokenizing: true

hygiene:
  near_duplicate_threshold: 0.85
  deduplicate_before_tagging_and_budgeting: true
  cross_check_reasoning_against_mathematics: true
  contamination_check: eval/retention/
  recheck_after_selection: true

manifest:
  required_metrics:
    - anchor_tokens
    - token_metric
    - per_category_total_tokens
    - per_category_assistant_tokens
    - per_category_example_counts
    - holdout_token_totals
    - tag_rule_version
    - tagging_audit_results
    - template_cap_counts
    - translation_task_decision
    - cross_contamination_check
    - packing_efficiency
    - padding_waste

# --- Rules -------------------------------------------------------------------
rules:
  - "Required schema: every record must satisfy configs/data/schema.yaml (see docs/DATA_SCHEMA.md)."
  - "Quality gate: records flagged by quality.flagged are never selected."
  - "Primarily English: the retention slice preserves the base model's capabilities."
  - "Preserve general capabilities: mathematics, coding, reasoning, instruction following, knowledge QA."
  - "Do NOT require Tunisian output; Tunisian ability comes from the other four slices."
  - "Retention TRAINING data is disjoint from the retention EVALUATION set in eval/retention/."
  - "Holdout is reserved first and is never part of the training file."
  - "Selection is deterministic and reproducible from this file + the seed."
  - "No external dataset is named in this file; adapters normalize into the canonical schema."
