# =============================================================================
# configs/data/franco_tunisian.yaml — Franco-Tunisian code-switching slice spec
# =============================================================================
#
# PURPOSE
#   The franco_tunisian slice provides French/Tunisian code-switching content for
#   Tunisian adaptation. It is 0.12 of the training cocktail per
#   configs/data/mixture.yaml.
#
#   It is *** NOT *** retention. It is *** NOT *** msa_formal.
#
#   Anchoring rule (from docs/data/tunisian_code_switching.md §6.1):
#     T_franco = (0.12 ÷ 0.05) × T_code = 2.4 × T_code
#   where coding is 25% of the 0.20 retention slice, i.e. 0.05 of the whole
#   mixture, and T_code ≈ 7.7M assistant tokens (measured from retention).
#
#   Token-aware selection mirrors docs/data/retention_mohamed.md Section 3.
#
# DATASET-INDEPENDENT BY DESIGN
#   No external dataset is named here. Candidate pools are supplied at run time
#   as canonical JSONL; the selector reads THIS file for its targets.
#
# CONSUMED BY
#   scripts/process_franco_tunisian.py
# =============================================================================

spec_version: "1.2"
slice: franco_tunisian

# --- Purpose -----------------------------------------------------------------
purpose: tunisian_adaptation
is_tunisian_adaptation: true
requires_tunisian_output: true

# --- Required schema ---------------------------------------------------------
schema:
  file: configs/data/schema.yaml
  docs: docs/DATA_SCHEMA.md
  required_fields: [id, messages, category, source, language]
  messages:
    min_turns: 2
    roles: [system, user, assistant]
    last_role: assistant
    non_empty_content: true

# --- Production token budgets ------------------------------------------------
# Anchor: retention coding slice (T_code measured from retention selection).
# T_franco = 2.4 × T_code ≈ 18.5M assistant tokens.
token_budget:
  unit: tokens
  metric: assistant_tokens
  fallback_metric: total_tokens
  require_same_metric_for_all_categories: true
  tokenizer: gemma
  include_chat_template: true
  count: [total_tokens, assistant_tokens]
  anchor:
    category: general_instruction   # Franco Tunisian anchor category
    target_examples: null           # fill to T_franco = 2.4 × T_code
  category_multipliers:
    general_instruction: 1.0        # anchor = 1.0 × T_franco
    knowledge_qa: 1.0               # supplement = 1.0 × T_franco
    mathematics: 0.0                # not applicable to franco_tunisian
    reasoning: 0.0
    coding: 0.0
  tolerance: 0.02
  context_window_tokens: 16384
  max_formatted_tokens_per_example: 15500
  whole_examples_only: true
  on_overlength: drop
  holdout:
    reserve_first: true
    unit: tokens
    target_tokens: null     # set as ratio of T_franco before production
    category_shares:
      general_instruction: 0.5
      knowledge_qa: 0.5
    pack_with_training: false
  packing:
    strategy: first_fit_decreasing
    sequence_length_tokens: 16384
    attention_mask: block_diagonal
    reset_position_ids_per_example: true
    verify_gemma3_hybrid_attention: true
    pad_only_final_partial_sequence: true

# --- Language ----------------------------------------------------------------
language:
  primary: mixed
  allowed: [mixed, fr, ar, arabizi]
  allow_other_languages: false

# --- Script ------------------------------------------------------------------
script:
  allowed: [latin, arabic, mixed]

# --- Quality gate ------------------------------------------------------------
quality:
  required_schema_valid: true
  exclude_flagged: true
  language_allowed: [mixed, fr, ar, arabizi]
  script_allowed: [latin, arabic, mixed]
  require_unique_ids: true
  dedupe_before_selection: true
  min_messages_turns: 2
  end_with_assistant: true

# --- Holdout -----------------------------------------------------------------
holdout:
  target_examples: null
  stratified: true
  output: data/processed/franco_tunisian/holdout.jsonl

# --- Output ------------------------------------------------------------------
output:
  train: data/processed/franco_tunisian/train.jsonl
  holdout: data/processed/franco_tunisian/holdout.jsonl
  manifest: data/manifests/franco_tunisian/selection.json

# --- Selection behaviour -----------------------------------------------------
selection:
  seed: 42
  stratify_by: source
  stable_sort_by: id
  max_share_per_source: 1.0
  exclude_flagged: true
  require_unique_ids: true
  on_insufficient_candidates: error

# --- Rules -------------------------------------------------------------------
rules:
  - "Required schema: every record must satisfy configs/data/schema.yaml."
  - "Quality gate: records flagged by quality.flagged are never selected."
  - "Tunisian adaptation: Franco-Tunisian code-switching is NOT retention or msa_formal."
  - "Code-switching required: every record must have code_switching == true."
  - "Holdout is reserved first and is never part of the training file."
  - "Selection is deterministic and reproducible from this file + the seed."
  - "Tokens are the currency: T_franco = 2.4 × T_code (retention anchor)."
  - "Whole examples only: any formatted example over ~15,500 Gemma tokens is dropped whole, never truncated."
  - "Tokenize with Gemma's own tokenizer on the formatted example; record total AND assistant tokens."
