# =============================================================================
# configs/data/franco_tunisian.yaml — French/Tunisian code-switching slice spec
# =============================================================================
#
# PURPOSE
#   The franco_tunisian slice exists to teach Gemma 3 27B French <-> Tunisian
#   Derja code-switching: examples that genuinely mix French and Tunisian
#   Arabic (Arabizi or Arabic script) in a single conversation.
#
#   It is 0.12 of the training TOKENS (per configs/data/mixture.yaml) and is a
#   tunisian_adaptation slice — NOT retention, NOT msa_formal.
#
#   Production strategy: docs/data/tunisian_code_switching.md Section 6,
#   mirroring docs/data/retention_mohamed.md Section 3 and
#   docs/data/retention_haithem.md Section 2.
#   Token-aware selection/packing is pending implementation in the pipeline.
#
# DATASET-INDEPENDENT BY DESIGN
#   No external dataset is named here. Candidate pools are supplied at run time
#   as canonical JSONL (see docs/DATA_SCHEMA.md); the selector reads THIS file
#   for its targets, never a dataset name.
#
# CONSUMED BY
#   scripts/prepare_data.sh
#   mixture validation (configs/data/mixture.yaml)
# =============================================================================

spec_version: "1.1"
slice: franco_tunisian

# --- Purpose (machine-readable, so tests can assert it) ----------------------
purpose: tunisian_adaptation
is_tunisian_adaptation: true      # MUST stay true. Franco-Tunisian IS adaptation.
requires_tunisian_output: true    # MUST stay true. Output is Tunisian/French CS.

# --- Required schema ---------------------------------------------------------
# The canonical schema is the ONLY accepted input shape. Records that fail
# schema validation are REJECTED, never coerced or auto-fixed.
schema:
  file: configs/data/schema.yaml
  docs: docs/DATA_SCHEMA.md
  required_fields: [id, messages, category, source, language]
  messages:
    min_turns: 2
    roles: [system, user, assistant]
    last_role: assistant
    non_empty_content: true

# --- Size --------------------------------------------------------------------
# Working example-count target for the slice. Under token-budget selection
# (see `token_budget` below) this is a reference ceiling: the slice is filled
# to its TOKEN share of the mixture with whole examples.
target_examples: null            # TBD: franco_tunisian training examples (0.12 of cocktail in tokens)

# --- Token-budget selection (mirrors the retention strategy) ------------------
# Machine-readable form of the strategy in docs/data/tunisian_code_switching.md
# (Section 6). Budgets, shares and the holdout are measured in TOKENS, because
# tokens — not example counts — are what the model learns from.
token_budget:
  # The mixture share (franco_tunisian: 0.12 in configs/data/mixture.yaml) is a
  # TOKEN share of the final training cocktail; the slice is filled with
  # whole examples until its token budget is reached.
  unit: tokens
  # Anchor: coding slice of the retention track, per the anchoring rule:
  #   T_franco = (0.12 ÷ 0.05) × T_code = 2.4 × T_code ≈ 18.5M tokens
  #   (assuming T_code ≈ 7.7M, per docs/data/tunisian_code_switching.md §6.1)
  anchor:
    category: coding
    slice: retention
    multiplier: 2.4
  # Fill each budget with whole examples and stop inside a ±2% tolerance
  # band: stop before overshooting, or swap in a smaller example.
  tolerance: 0.02
  # Training context window: 16,384 tokens (~15,500 usable per example after
  # chat-template overhead).
  context_window_tokens: 16384
  # Hard safety net: drop WHOLE any formatted example longer than this —
  # never truncate (cut examples are semantically broken).
  max_formatted_tokens_per_example: 15500
  # Tokenize with Gemma's own tokenizer on the FORMATTED example (chat
  # template included); generic counters underestimate French/Tunisian CS text.
  tokenizer: gemma
  # Record both totals in the selection manifest: total tokens (everything
  # the model reads) and assistant tokens (the loss signal).
  count: [total_tokens, assistant_tokens]
  # Packing is a training-side concern, documented here so the whole recipe
  # lives in one file: biggest-first (first-fit decreasing) into 16k
  # sequences, block-diagonal attention masks, padding only on the final
  # partial sequence of the slice.
  packing:
    strategy: first_fit_decreasing
    sequence_length_tokens: 16384
    attention_mask: block_diagonal
    pad_only_final_partial_sequence: true

# --- Categories --------------------------------------------------------------
# The franco_tunisian slice defines NO per-category targets. It is one
# code-switching pool selected to the token budget. Records still carry the
# canonical `category` field required by configs/data/schema.yaml, but it is
# descriptive metadata only — never a selection constraint.
# franco_tunisian examples are predominantly general_instruction / knowledge_qa.
categories: null

# --- Language ----------------------------------------------------------------
language:
  primary: mixed
  # Canonical `language` values accepted inside this slice.
  allowed: [fr, ar, arabizi, mixed]
  # Franco-Tunisian IS code-switched by design.
  allow_other_languages: false

# --- Script ------------------------------------------------------------------
script:
  # Canonical `script` value(s) accepted inside this slice.
  allowed: [latin, arabic, mixed]

# --- Quality gate ------------------------------------------------------------
# Machine-readable quality rules asserted by tests. The selector enforces these
# on every candidate BEFORE selection; nothing is auto-fixed or downgraded.
quality:
  required_schema_valid: true   # hard reject any schema-invalid record
  exclude_flagged: true         # quality.flagged == true is never selected
  language_allowed: [fr, ar, arabizi, mixed]   # mirrors `language.allowed`
  script_allowed: [latin, arabic, mixed]       # Franco-Tunisian CS can be Latin or Arabic script
  require_unique_ids: true      # dedupe by id before selection (first wins)
  dedupe_before_selection: true
  min_messages_turns: 2
  end_with_assistant: true
  require_code_switching: true  # every record must genuinely mix French + Tunisian

# --- Holdout -----------------------------------------------------------------
# Reserved BEFORE training selection and never included in training.
holdout:
  target_examples: null          # TBD: token-proportional across sources
  # Token-proportional holdout: stratified by source, never packed with
  # training data.
  stratified: true
  stratify_by: source
  # Emitted to data/processed/franco_tunisian/holdout.jsonl
  output: data/processed/franco_tunisian/holdout.jsonl

# --- Output ------------------------------------------------------------------
output:
  train: data/processed/franco_tunisian/train.jsonl
  holdout: data/processed/franco_tunisian/holdout.jsonl
  manifest: data/manifests/franco_tunisian/selection.json

# --- Selection behaviour -----------------------------------------------------
selection:
  # Deterministic: same candidates + same seed => byte-identical output.
  seed: 42
  # No category stratification (see `categories: null` above); diversify by
  # source instead.
  # Source diversity: no single `source` may exceed this share of the slice.
  max_share_per_source: 1.0
  # Records flagged by quality.flagged are never selected.
  exclude_flagged: true
  # Deduplicate by id before selecting (see src/data/dedupe.py).
  require_unique_ids: true
  # If the target cannot be filled, FAIL LOUDLY rather than silently
  # under-filling the slice.
  on_insufficient_candidates: error
  # Token-budget mode (see `token_budget` above): fill the slice to its token
  # share of the training cocktail with WHOLE examples; `target_examples`
  # stays the example-count ceiling.
  mode: token_budget

# --- Rules (documented, asserted by tests) -----------------------------------
rules:
  - "Required schema: every record must satisfy configs/data/schema.yaml (see docs/DATA_SCHEMA.md)."
  - "Quality gate: records flagged by quality.flagged are never selected."
  - "Code-switching: every franco_tunisian record must genuinely mix French and Tunisian (code_switching: true)."
  - "Franco-Tunisian is a SEPARATE purpose from retention and msa_formal; never counted as either."
  - "Franco-Tunisian TRAINING data is disjoint from the franco_tunisian EVALUATION set in eval/."
  - "Holdout is reserved first and is never part of the training file."
  - "Selection is deterministic and reproducible from this file + the seed."
  - "No external dataset is named in this file; adapters normalize into the canonical schema."
  - "Tokens are the currency: the 12% franco_tunisian share of the mixture is a token share; selection stops inside a ±2% tolerance band."
  - "Whole examples only: any formatted example over ~15,500 Gemma tokens is dropped whole, never truncated."
  - "Tokenize with Gemma's own tokenizer on the formatted example; record total AND assistant tokens in the selection manifest."
  - "Stratify by source before counting tokens; set per-source caps so no single source dominates."
  - "Packing: biggest-first into 16k sequences with block-diagonal attention masks (verified for Gemma 3 hybrid attention); pad only the final partial sequence."
