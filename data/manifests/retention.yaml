# =============================================================================
# data/manifests/retention.yaml
# Replay / rehearsal mixture (TRAINING) — Gemma Tounsi 1.0 (27B)
# =============================================================================
#
# PURPOSE
#   Declares the general-purpose data replayed DURING training so that Gemma's
#   existing instruction-following and reasoning capabilities are not degraded
#   by Tunisian adaptation. Builds data/retention.jsonl.
#
# STATUS: CANDIDATE SOURCES ACQUIRED — selection NOT yet performed.
#   Three candidate pools are declared below (MetaMathQA, Code-Feedback, SlimOrca).
#   The final 20k training selection + holdout (configs/data/retention.yaml)
#   is a LATER step and has NOT been run.
#
# CRITICAL DISTINCTION
#   This file describes TRAINING data (replay/rehearsal).
#   The retention BENCHMARK is a separate, disjoint set defined in
#   data/manifests/eval.yaml and executed from eval/retention/.
#   Mixing the two would make retention evaluation meaningless: the model would
#   be measured on examples it was trained on.
#
# HARD RULES
#   - No item in this manifest may overlap the retention EVAL set.
#   - Sources must be disjoint from eval sources at the source level where
#     possible, not merely deduplicated at the record level.
#   - Every source must be declared with license and permitted use.
#
# TODO
#   [ ] Add more replay sources to cover all five capabilities:
#       mathematics, coding, reasoning, instruction following, knowledge QA.
#   [ ] Verify record-level disjointness from eval.yaml with a contamination check.
#   [ ] Decide the replay ratio (NOT decided yet — see `mixture`).
#   [ ] Document decisions in docs/DATA.md.
# =============================================================================

version: 1
name: gemma-tounsi-retention-replay
description: >-
  General-capability replay/rehearsal data used during training to mitigate
  catastrophic forgetting. Three candidate sources acquired; final selection
  (20k train + 2.5k holdout) not yet performed.

constraints:
  purpose: training           # replay/rehearsal — NOT evaluation
  contains_evaluation_data: false
  # Must be verified against data/manifests/eval.yaml before any training run.
  disjoint_from_retention_eval: true
  contamination_check_required: true

# -----------------------------------------------------------------------------
# capabilities_to_preserve
# Which abilities the replay mixture is meant to protect. Each should map to a
# measurable task in the retention evaluation track.
# -----------------------------------------------------------------------------
capabilities_to_preserve:
  - mathematics
  - coding
  - reasoning
  - instruction_following
  - knowledge_qa

# -----------------------------------------------------------------------------
# sources — one entry per corpus.
#
# Schema (all fields required once a source is added):
#   - id:            short stable identifier, used in logs and reports
#     type:          hf_dataset | url | local | scraped | synthetic | human
#     location:      dataset id / URL / path (no credentials inline)
#     revision:      commit SHA, tag, or snapshot date — MUST be pinned
#     capability:    preserved capability this source covers
#     license:       SPDX id or explicit terms
#     permitted_use: why redistribution/training is allowed
#     attribution:   required credit, if any
#     notes:         quality caveats, coverage, known issues
#
# STATUS: candidates acquired (data/raw/), NOT yet selected or cleaned.
# -----------------------------------------------------------------------------
sources:
  - id: metamathqa
    type: hf_dataset
    location: meta-math/MetaMathQA
    revision: aa4f34d3d2d3231299b5b03d9b3e5a20da45aa18
    capability: mathematics
    license: MIT
    permitted_use: MIT license permits use in model training
    attribution: MetaMathQA (Yu et al., 2023) — https://huggingface.co/datasets/meta-math/MetaMathQA
    row_count: 395000
    local_path: data/raw/meta-math__MetaMathQA/MetaMathQA-395K.json
    notes: >-
      395K math word problems generated from GSM8K and MATH. Acquired but not
      yet normalized into the canonical schema; selection is a later step.

  - id: code-feedback
    type: hf_dataset
    location: m-a-p/Code-Feedback
    revision: f411b16a97c910ac9acf8b0d0948e340aa77cc34
    capability: coding
    license: Apache-2.0
    permitted_use: Apache-2.0 license permits use in model training
    attribution: m-a-p / Code-Feedback — https://huggingface.co/datasets/m-a-p/Code-Feedback
    row_count: 66383
    local_path: data/raw/m-a-p__Code-Feedback/Code-Feedback.jsonl
    notes: >-
      66K coding instruction-following examples with feedback. Acquired but not
      yet normalized into the canonical schema; selection is a later step.

  - id: slimorca
    type: hf_dataset
    location: Open-Orca/SlimOrca
    revision: ce9ed009ef3292bac33d3520afaf5ec804066120
    capability: instruction_following
    license: MIT
    permitted_use: MIT license permits use in model training
    attribution: >-
      SlimOrca (Lian et al., 2023) —
      https://huggingface.co/datasets/Open-Orca/SlimOrca
    row_count: 517982
    local_path: data/raw/Open-Orca__SlimOrca/oo-labeled_correct.gpt4.sharegpt.jsonl
    notes: >-
      ~518K English GPT-4 completions with verification pass from the OpenOrca
      project. Covers general instruction, reasoning, and knowledge QA.
      Acquired but not yet normalized into the canonical schema; selection is
      a later step.

preprocessing:
  normalization: null   # TODO
  cleaning: []          # TODO
  filters: []           # TODO
  deduplication: null   # TODO: incl. cross-check against eval sets

# -----------------------------------------------------------------------------
# mixture — replay ratio relative to the Tunisian training data.
#
# DELIBERATELY UNDECIDED. The replay proportion is an experimental variable and
# must not be guessed now; it will be tuned against the retention benchmark.
# -----------------------------------------------------------------------------
mixture:
  weights: {}          # TODO: source id -> weight/percentage
  replay_ratio: null   # TODO: share of total training tokens/examples
  seed: null           # TODO
  target_size: null

output:
  path: data/retention.jsonl
  format: jsonl
  schema: null         # TODO: match the schema used by data/train.jsonl