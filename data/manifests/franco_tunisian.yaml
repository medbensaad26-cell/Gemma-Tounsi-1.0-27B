# -----------------------------------------------------------------------------
# mixture — per-source share of the franco_tunisian slice.
#
# DELIBERATELY UNDECIDED. The per-source split of the franco_tunisian token
# budget (0.12 of the cocktail per configs/data/mixture.yaml) is an experimental
# decision and must not be guessed now; mixture weights in
# configs/data/mixture.yaml are unchanged. Under the token-budget strategy,
# when decided, weights are TOKEN shares of the franco_tunisian budget — not
# example shares.
# -----------------------------------------------------------------------------
mixture:
  weights: {}          # TODO: source id -> token share of the franco_tunisian budget
  unit: tokens         # weights, when decided, are token shares
  target_size: null    # TBD: franco_tunisian training examples (0.12 of cocktail in tokens)
  seed: null           # TODO: 42 at selection time

# -----------------------------------------------------------------------------
# output
# -----------------------------------------------------------------------------
output:
  path: data/processed/franco_tunisian/train.jsonl
  format: jsonl
  schema: null         # TODO: match the canonical schema (docs/DATA_SCHEMA.md)
