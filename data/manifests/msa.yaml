# -----------------------------------------------------------------------------
mixture:
  weights: {}          # TODO: source id -> token share of the msa_formal budget
  unit: tokens         # weights, when decided, are token shares
  target_size: null    # TODO: 8,000 MSA training examples (configs/data/msa.yaml)
  seed: null           # TODO: 42 at selection time (configs/data/msa.yaml)

output:
  path: data/processed/msa/train.jsonl
  format: jsonl
  schema: null         # TODO: match the canonical schema (docs/DATA_SCHEMA.md)