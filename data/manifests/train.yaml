# =============================================================================
# data/manifests/train.yaml
# Tunisian adaptation training mixture — Gemma Tounsi 1.0 (27B)
# =============================================================================
#
# PURPOSE
#   Declares every source that contributes to the Tunisian adaptation training
#   data (Derja in Arabic script + Arabizi), and how those sources are combined
#   into data/train.jsonl.
#
# STATUS: SOURCES ACQUIRED AND PROCESSED. All candidate sources declared below
#   have been downloaded into data/raw/, canonicalized, validated, deduplicated,
#   and split into train/holdout. Processed output lives in data/processed/ and
#   the combined training file is data/train.jsonl.
#
# HARD RULES
#   - Every source must be declared here BEFORE it is used. Undeclared data
#     must never reach data/train.jsonl.
#   - Every source must carry its license and permitted use.
#   - NO evaluation data may appear here. TounsiBench, the Arabizi benchmark and
#     the retention EVAL set are evaluation-only (see eval.yaml).
#   - Replay/rehearsal data for general-capability preservation belongs in
#     retention.yaml, not here.
#
# LICENSE NOTES
#   - TArC (arbml/TArC): CC-BY-NC-SA-4.0 — non-commercial. Commercial model
#     release requires excluding TArC or using it only for non-commercial eval.
#   - linagora/Tunisian_Derja_Dataset: CC-BY-SA-4.0 — share-alike. May conflict
#     with Apache-2.0 weight release; legal review required before production.
#
# TODO
#   [x] Identify candidate Derja / Arabizi corpora and verify licensing.
#   [x] Declare each source using the schema documented below.
#   [x] Acquire all candidate sources into data/raw/ (see scripts/acquire_* and
#       data/raw/*/_provenance.json).
#   [ ] Decide mixture weights (NOT decided yet — see `mixture`).
#   [ ] Define normalization rules for Arabic script and Arabizi.
#   [ ] Define dedup + contamination checks against every eval set (eval.yaml
#       is a skeleton; contamination check blocked until eval sources defined).
#   [ ] Acquire Math-and-Coding Arabizi/Derja data to meet the 20% cross-cutting
#       technical quota (configs/data/mixture.yaml). Current Arabizi/Derja pools
#       are 0% technical.
#   [ ] Mirror all provenance decisions in docs/DATA.md.
#   [ ] Run Soup preflight (validate/stats/dedup/doctor) on Arabizi and Derja
#       pools (blocked: soup 0.73.3 only in pinned container).
# =============================================================================

version: 1
name: gemma-tounsi-train
description: >-
  Tunisian Arabic (Derja + Arabizi) adaptation training mixture. Three
  candidate sources declared and license-reviewed (see docs/DATA.md §2.1);
  none downloaded yet. Mixture weights not decided.

# Guarantees asserted by this manifest; prepare_data.sh should verify them.
constraints:
  purpose: training
  contains_evaluation_data: false
  # TODO: fail preparation if any record here overlaps an eval set.
  contamination_check_required: true

# -----------------------------------------------------------------------------
# sources — one entry per corpus.
#
# Schema (all fields required once a source is added):
#   - id:            short stable identifier, used in logs and reports
#     type:          hf_dataset | url | local | scraped | synthetic | human
#     location:      dataset id / URL / path (no credentials inline)
#     revision:      commit SHA, tag, or snapshot date — MUST be pinned
#     script:        derja_arabic | arabizi | mixed
#     license:       SPDX id or explicit terms
#     permitted_use: why redistribution/training is allowed
#     attribution:   required credit, if any
#     notes:         quality caveats, dialect coverage, known issues
# -----------------------------------------------------------------------------
sources:
  - id: linto-text-ar-tn-derja
    type: hf_dataset
    location: linagora/linto-dataset-text-ar-tn
    revision: 25dbb0aff3e5d4db1db5a69f7a4077280b442f4b
    script: derja_arabic
    license: Apache-2.0
    permitted_use: >-
      PROVISIONAL. Dataset card declares Apache-2.0, but it is a compilation
      of third-party corpora and the same subsets also appear in
      linagora/Tunisian_Derja_Dataset under CC-BY-SA-4.0. Per-subset upstream
      licenses must be traced before production use.
    attribution: >-
      LINAGORA Labs, LinTO Tunisian text dataset (arXiv:2504.02604);
      per-subset upstream credits to be completed.
    notes: >-
      991,371 raw rows in 20 subsets, columns ids/text/text_raw, 77-100%
      Arabic script per subset, no instruction format (adapters must build
      messages). CANDIDATE subsets: Derja_tunsi, HkayetTounsia, KisatiAna,
      TunBERT, TuDiCOI, HkayetErwi, TunHistoires, Chakhabitt, TRCD, TSAC
      (toxicity filter), Tweet_TN (PII filter). EXCLUDED: T-HSAB (hate
      speech), TN_RAP_lyrics (copyrighted lyrics), BRAD (not Tunisian, to
      verify), CombinedNames (content unclear), Tunisien_Dialect_Summary-llama2
      (model-generated). TunSwitch subsets (775K rows, 99-100% Arabic script)
      are claimed by franco_tunisian.yaml; origin check pending. Overlap with
      franco_tunisian.yaml and with linagora/Tunisian_Derja_Dataset must be
      deduplicated before token counting.

  - id: farah21-tunisia-tech-arabizi
    type: hf_dataset
    location: Farah21/Tunisia_Tech
    revision: be5ca6c51c2c6c7557da73672be030eeb64c68be
    script: arabizi
    license: CC-BY-4.0
    permitted_use: >-
      Dataset card declares CC-BY-4.0. Underlying text is Reddit user posts;
      confirm that the card's license covers third-party content before
      production use.
    attribution: Farah21 (TunisIA-Co-Lab), Reddit Tunisia Tech QA dataset.
    notes: >-
      Use ONLY rows with dialect == tunisian_arabizi from the train split 
      (148 rows; 17 more exist in the test split, which is excluded).
      Test split (550 rows) is EXCLUDED from training. Overlaps
      Farah21/reddit-tunisia-qa (strict subset, same ids); rows used by
      franco_tunisian.yaml must not be counted twice. Replies are other users'
      comments, not assistant answers; filter PII, political rants and
      mental-health disclosures.

  - id: ctab-arabizi
    type: url
    location: https://zenodo.org/records/4781769
    revision: zenodo-4781769-v4-2021-05-11
    script: arabizi
    license: CC-BY-4.0
    permitted_use: >-
      Zenodo record declares CC-BY-4.0 (attribution only). Messages were
      scraped from public Facebook pages; PII handling required.
    attribution: >-
      Amara A., Turki H., Hadj Taieb M.A., Ben Aouicha M., Ellouze K. -
      CTAB: Corpus of Tunisian Arabizi (2021), Data Engineering and
      Semantics Research Unit, University of Sfax; part of the Tunisian
      Arabic Corpus (tunisiya.org).
    notes: >-
      13 files (CTAB-SAMPLE0001..0013.txt, ~306 kB of text plus CTAB.pdf),
      one raw Arabizi message per line, no annotation or spelling
      normalization. File names suggest a sample; check tunisiya.org for a
      larger release. Very small (est. ~100K tokens): seed and
      detector/eval-grade material, not slice volume. 5,702 non-blank 
      messages; all 14 files md5-verified against Zenodo; PII scan pending.

  - id: syrinesmati-tunisian-dialect-corpus
    type: hf_dataset
    location: Syrinesmati/tunisian-dialect-corpus
    revision: main
    script: derja_arabic
    license: Apache-2.0
    permitted_use: >-
      Dataset card declares Apache-2.0. Permits use in model training and
      release of adapted weights under Apache-2.0.
    attribution: >-
      Tunisian Dialect Corpus (Cleaned Arabic-Only) — Syrinesmati —
      https://huggingface.co/datasets/Syrinesmati/tunisian-dialect-corpus
    notes: >-
      1,180,174 cleaned Tunisian Arabic (Derja) rows in Arabic script,
      single `text` field, ~208 MB parquet. Aggregated and cleaned from
      14 public sources (linagora/Tunisian_Derja_Dataset,
      atakaboudi/Dialect_of_Tunisia-Work_Collection, tunis-ai/
      tunisian-msa-parallel-corpus, Arbi-Houssem STT/TTS, linagora/
      linto-asr-ar-tn-0.1, TADI, tunbert/TAD, khaled123/tunninjaar,
      Hala-Mulki/T-HSAB non-hate rows, Tunisian Reading Comprehension,
      Naim Mhedhbi corpus, TSAC, khaled123/Testtun, khaled123/Tuniset).
      Raw text, not instruction-formatted — requires conversion to canonical
      schema and quality filtering. NOTE: derived from CC-BY-SA-4.0 upstream
      sources (linagora/Tunisian_Derja_Dataset among them); card declares
      Apache-2.0 but share-alike provenance should be re-verified before
      production use.

  - id: linagora-fineweb2-tunisian-arabic
    type: hf_dataset
    location: linagora/fineweb2_Tunisian_Arabic
    revision: main
    script: derja_arabic
    license: ODC-By-1.0
    permitted_use: >-
      Open Data Commons Attribution License v1.0; permits redistribution and
      re-use with attribution. Safe for Apache-2.0 weight release.
    attribution: >-
      FineWeb2 Tunisian Arabic portion — LINAGORA Labs, June 2025 —
      https://huggingface.co/datasets/linagora/fineweb2_Tunisian_Arabic
    notes: >-
      265,217 Tunisian Arabic (aeb) rows from Common Crawl, Arabic script.
      Fields: text, id, dump, url, date, file_path, language, language_score,
      language_script, minhash_cluster_size, top_langs. Web/forum text,
      noisy and not instruction-formatted; requires cleaning and conversion
      to canonical schema. Language-ID score field present (>=0.32 observed);
      filter on language_score before use.

  - id: tuniizi-v2-arabizi
    type: url
    location: https://zenodo.org/records/4275240
    revision: zenodo-4275240-v1-2020-11-13
    script: arabizi
    license: CC-BY-4.0
    permitted_use: >-
      Zenodo record declares CC-BY-4.0 (attribution only). Comments extracted
      from public social media; manually annotated by Tunisian native speakers.
    attribution: >-
      Chayma Fourati, Abir Messaoudi, Hatem Haddad, Moez BenHajhmida,
      Aymen Ben Elhaj Mabrouk, Malek Naski — TUNIZI v2: A large Tunisian
      Arabizi Dialectal Dataset for Sentiment Analysis (WANLP 2021),
      iCompass.
    notes: >-
      ~100k Arabizi comments (movies, politics, sport, …) annotated positive/
      negative/neutral. CC-BY-4.0 on Zenodo (DOI 10.5281/zenodo.4275240).
      Raw sentiment-labeled text, not instruction-formatted; requires
      conversion to canonical schema. PII scan pending. v1 (9,210 sentences)
      also exists on Zenodo/GitHub; v2 is the larger release.

  - id: tarc-arabizi
    type: hf_dataset
    location: arbml/TArC
    revision: 02519acd39681256467f5b023c641e8138bfb31d
    script: arabizi
    license: CC-BY-NC-SA-4.0
    permitted_use: >-
      CC BY-NC-SA 4.0 — share-alike with a non-commercial clause. Derivative
      works must be released under the same license; commercial model release
      is restricted. If commercial release is a requirement, TArC should be
      excluded or used only for non-commercial evaluation.
    attribution: >-
      arbml — TArC: Tunisian Arabish Corpus —
      https://huggingface.co/datasets/arbml/TArC
    notes: >-
      47,970+ Arabizi sentences across forum (755), social (3,162), blog (366),
      and rap (514) genres. Multi-layer annotation: token classification
      (arabizi/foreign/emotag), CODA transliteration, POS tagging. Metadata:
      governorate, age range, gender (some rows incomplete). Acquired into
      data/raw/arbml__TArC/. Used as high-quality annotated Arabizi supplement
      to TUNIZI v2.

  - id: linagora-tunisian-derja-dataset
    type: hf_dataset
    location: linagora/Tunisian_Derja_Dataset
    revision: a6defa513c5a33d68be82a7baf6da4edd43866a5
    script: derja_arabic
    license: CC-BY-SA-4.0
    permitted_use: >-
      CC-BY-SA-4.0 — share-alike; LEGAL REVIEW REQUIRED before use in
      production training if adapted weights are to be released under
      Apache-2.0. Derivative works must be released under the same license.
    attribution: >-
      Wajdi Ghezaiel and Jean-Pierre Lorré (LINAGORA), 2025 —
      https://huggingface.co/datasets/linagora/Tunisian_Derja_Dataset
    notes: >-
      ~2.23M raw rows across 14 sub-corpora (~332 MB). For Regular Derja
      (Arabic script), the relevant sub-corpora are: Derja_tunsi (13,037),
      HkayetErwi (946), MADAR_TunisianDialect (12,000), QADI_TunisianDialect
      (8,879), Sentiment_Derja (22,890), TA_Segmentation (30,530), TSAC
      (8,416), TuDiCOI (3,426), TunBERT (67,186), TunisianSentimentAnalysis
      (23,786), Tweet_TN (39,637). Total ~230K Arabic-script rows. Excluded:
      TunSwitchCodeSwitching (394,160), TunSwitchTunisiaOnly (380,546),
      Tunisian_Dialectic_English_Derja (1,220,712) — code-switched/English,
      belong to franco_tunisian allocation. A Unicode Arabic-script gate is
      required since soup langdetect returns 'unknown' for Arabic-script rows.

# EXCLUDED / QUARANTINED (not declared; see docs/DATA.md §2.1)
#   hamzabouajila/tunisian-derja-unified-raw-corpus   CC-BY-SA-4.0, re-upload of the above
#   tunis-ai/MADAR-TUN                 CC-BY-NC-3.0 on card (paper says CC-BY-SA-4.0)
#   chaymafourati/tunizi               license unknown, loader script only
#   khaled123/Tunisian_Dialectic_English_Derja   CreativeML Open RAIL-M

# -----------------------------------------------------------------------------
# preprocessing — applied when building processed/ from raw/.
# TODO: decide and document each rule; leave empty until decided.
# -----------------------------------------------------------------------------
preprocessing:
  # TODO: Unicode normalization form for Arabic script (e.g. NFC vs NFKC).
  normalization: null
  # TODO: tatweel/diacritics/punctuation handling; Arabizi casing rules.
  cleaning: []
  # TODO: length bounds, language-ID filtering, quality heuristics.
  filters: []
  # TODO: exact + near-duplicate strategy (within and across sources).
  deduplication: null

# -----------------------------------------------------------------------------
# mixture — how sources are combined into data/train.jsonl.
#
# DELIBERATELY UNDECIDED. Per project rules, dataset percentages are not to be
# invented at this stage; they will be set after the Soup environment and the
# data pipeline are validated.
# -----------------------------------------------------------------------------
mixture:
  weights: {}      # TODO: source id -> weight/percentage
  seed: null       # TODO: fix a seed for deterministic shuffling
  target_size: null

# -----------------------------------------------------------------------------
# output — produced by scripts/prepare_data.sh. Gitignored.
# -----------------------------------------------------------------------------
output:
  path: data/train.jsonl
  format: jsonl
  # TODO: record the exact record schema once Soup's expected input is confirmed.
  schema: null
