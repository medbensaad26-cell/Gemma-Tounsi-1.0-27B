# =============================================================================
# soup.yaml — SMOKE-TEST CONFIGURATION ONLY
# =============================================================================
#
# ############################################################################
# #  THIS IS NOT THE GEMMA TOUNSI 1.0 TRAINING RECIPE.                       #
# #  It is a minimal PLACEHOLDER whose only job is to prove that the         #
# #  Docker + Soup + CUDA path works and that a QLoRA/SFT config for         #
# #  Gemma 3 27B is ACCEPTED by Soup's schema.                               #
# #                                                                          #
# #  Every hyperparameter below is a placeholder, NOT a decision:            #
# #  LoRA rank/alpha/dropout, learning rate, epochs, batch size, gradient    #
# #  accumulation, sequence length and mixture ratios are all still          #
# #  DELIBERATELY UNDECIDED. Do not read any of them as a recipe.            #
# ############################################################################
#
# Validated against: soup-cli 0.73.3
#   schema source of truth: src/soup_cli/config/schema.py @ v0.73.3
#   (SoupConfig / DataConfig / TrainingConfig / LoraConfig)
# Every key used here exists in that schema. No field is invented.
#
# Run it with:
#   docker compose run --rm soup soup train --config /workspace/soup.yaml
#
# Paths are container paths: the repository root is mounted at /workspace.
# =============================================================================

# --- Base model --------------------------------------------------------------
# SoupConfig.base — HF model ID of the target base model (gated: needs HF_TOKEN).
base: google/gemma-3-27b-it

# SoupConfig.task — supervised fine-tuning.
task: sft

# SoupConfig.backend — stock transformers path (default). Not `unsloth`/`mlx`:
# the baseline must be proven on the plain path first.
backend: transformers

# --- Data --------------------------------------------------------------------
# PLACEHOLDER INPUT. data/train.jsonl does not exist yet and is produced by
# scripts/prepare_data.sh; no dataset is downloaded by this repository.
# The real mixture is defined in data/manifests/train.yaml.
data:
  train: ./data/train.jsonl
  format: alpaca      # DataConfig.format — placeholder; real format TBD.
  val_split: 0.1      # schema default, restated for clarity.
  max_length: 1024    # SMOKE-TEST value only, not a sequence-length decision.

# --- Training ----------------------------------------------------------------
training:
  # Smallest run that still exercises the full code path.
  epochs: 1
  lr: 2.0e-5
  batch_size: 1
  gradient_accumulation_steps: 1

  # QLoRA = 4-bit quantized base + LoRA adapter.
  # TrainingConfig.quantization accepts "4bit" — this is the QLoRA switch.
  quantization: 4bit

  # LoRA adapter (TrainingConfig.lora -> LoraConfig).
  # target_modules: "auto" lets peft resolve Gemma 3's module names, so no
  # module name is guessed here.
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

  # Layer streaming stays OFF (schema default is already false). It is BETA and
  # is only evaluated AFTER this baseline path is proven. Enabling it would also
  # force quantization=none, which would defeat the QLoRA check above.
  stream_layers: false

  seed: 42
  logging_steps: 1

# --- Output ------------------------------------------------------------------
# Under /workspace, so checkpoints/adapters appear on the host. Gitignored.
output: ./output/smoke-test
