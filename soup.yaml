# =============================================================================
# soup.yaml — Gemma Tounsi 1.0 (27B) SFT / QLoRA training configuration
# =============================================================================
#
# Validated against: soup-cli 0.73.3
#   schema source of truth: src/soup_cli/config/schema.py @ v0.73.3
#   (SoupConfig / DataConfig / TrainingConfig / LoraConfig)
# Every key used here exists in that schema. No field is invented.
#
# Run it with:
#   docker compose run --rm soup soup train --config /workspace/soup.yaml
#
# Paths are container paths: the repository root is mounted at /workspace.
# =============================================================================

# --- Base model --------------------------------------------------------------
# SoupConfig.base — HF model ID of the target base model (gated: needs HF_TOKEN).
base: google/gemma-3-27b-it

# SoupConfig.task — supervised fine-tuning.
task: sft

# SoupConfig.backend — stock transformers path (default). Not `unsloth`/`mlx`:
# the baseline must be proven on the plain path first.
backend: transformers

# SoupConfig.modality — text SFT.
modality: text

# --- Data --------------------------------------------------------------------
# Combined train+validation file (90% train + 5% val, no shuffle).
# Soup 0.73.3 DataConfig does NOT support a separate local validation file path;
# val_split is applied internally to the train file.
# Test set (5%) is deliberately excluded.
data:
  train: ./data/splits/soup_trainval.jsonl
  format: chatml
  val_split: 0.05263068143061777
  max_length: 8192
  train_on_responses_only: true
  chat_template: gemma3

# --- Training ----------------------------------------------------------------
training:
  epochs: 2
  lr: 1.0e-5
  batch_size: 1
  gradient_accumulation_steps: 8

  # QLoRA = 4-bit quantized base + LoRA adapter.
  quantization: 4bit

  # LoRA adapter (TrainingConfig.lora -> LoraConfig).
  # target_modules: "auto" lets peft resolve Gemma 3's module names.
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

  # Gradient checkpointing for memory savings on long sequences (8192 tokens).
  gradient_checkpointing: true

  # Include EOS/EOT tokens in the SFT loss so the model learns to stop generating.
  # Soup data doctor reported MAJOR: 100% of sampled rows never train an EOS/EOT.
  train_on_eot: true

  seed: 42
  logging_steps: 10
  save_steps: 100

  # Layer streaming stays OFF (schema default is already false). It is BETA and
  # is only evaluated AFTER this baseline path is proven. Enabling it would also
  # force quantization=none, which would defeat the QLoRA check above.
  stream_layers: false

# --- Output ------------------------------------------------------------------
# Under /workspace, so checkpoints/adapters appear on the host. Gitignored.
output: ./output/gemma-tounsi-1.0-27b
