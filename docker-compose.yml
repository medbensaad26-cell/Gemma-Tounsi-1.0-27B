# =============================================================================
# docker-compose.yml — Gemma Tounsi 1.0 (27B) training environment
# =============================================================================
#
# The host never needs PyTorch, CUDA or soup-cli installed: Soup only ever runs
# inside this container.
#
# Two services share ONE definition (YAML anchor `soup-common`) and differ only
# in GPU access:
#
#   soup      — the real training service. Reserves all NVIDIA GPUs.
#               Requires the NVIDIA Container Toolkit on the host.
#   soup-cpu  — identical, but WITHOUT the GPU reservation. For environment
#               validation on a machine that has no NVIDIA adapter (e.g. a
#               laptop). It is NOT for training: a 27B QLoRA run needs the GPU.
#
# Usage (from the repository root):
#   docker compose build
#   docker compose run --rm soup soup doctor
#   docker compose run --rm soup soup train --config /workspace/soup.yaml
#
# On a host without an NVIDIA GPU, `soup` fails with
#   "nvidia-container-cli: initialization error: ... no adapters were found".
# That is the GPU reservation working as intended. Validate with soup-cpu:
#   docker compose run --rm soup-cpu soup doctor
#
# The default command is inert (`soup --help`): `docker compose up` must never
# start a training run.
# =============================================================================

# Shared definition. `x-` keys are extension fields: Compose ignores them, so
# this block never becomes a service of its own.
x-soup-common: &soup-common
  # Built from ./Dockerfile, which pins ghcr.io/makazhanalpamys/soup:0.73.3.
  build:
    context: .
    dockerfile: Dockerfile
  image: gemma-tounsi-soup:0.73.3

  # Everything Soup reads or writes lives under the mounted repository.
  working_dir: /workspace

  volumes:
    # Repository root -> /workspace (read-write, so checkpoints, adapters and
    # logs written by Soup under /workspace appear directly on the host).
    - ./:/workspace
    # Persistent Hugging Face cache: base weights survive container restarts
    # and are re-downloaded only once. Override the host path with HF_CACHE.
    - ${HF_CACHE:-./.cache/huggingface}:/root/.cache/huggingface

  # Secrets (HF_TOKEN, WANDB_API_KEY, ...) come from the local .env, which is
  # gitignored and never baked into the image. `required: false` keeps the
  # stack usable before .env has been created.
  env_file:
    - path: .env
      required: false

  # Interactive shell support: `docker compose run --rm soup bash`.
  stdin_open: true
  tty: true

  # PyTorch dataloader workers use shared memory heavily.
  ipc: host

  # Inert default — no implicit training.
  command: ["soup", "--help"]

services:
  # --- Training service: GPU passthrough -------------------------------------
  soup:
    <<: *soup-common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- Validation-only service: no GPU reservation ---------------------------
  # Lets `soup doctor`, `soup --version` and the mount/secret checks run on a
  # host without an NVIDIA adapter. Training is NOT supported here.
  soup-cpu:
    <<: *soup-common
